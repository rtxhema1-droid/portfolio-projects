<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>فريش جوس - نسخة تجريبية</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1 class="brand">فريش<span>جوس</span></h1>
  <button id="open-cart">طلبي (<span id="count">0</span>)</button>
</header>
<section class="hero">
  <div>
    <h2>عصاير طازة،<br>معصورة قدامك</h2>
    <p>مانجو، موز، تفاح، فراولة وأكتر. اختار نوعك وشوفه في الكوباية.</p>
    <button class="light" id="spin-hint">اسحب الكوباية لتدويرها</button>
  </div>
  <div class="stage">
    <canvas id="c" aria-label="كوباية عصير ثلاثية الأبعاد"></canvas>
    <div class="fallback" id="fallback" aria-hidden="true">🥤</div>
  </div>
</section>
<p class="note">نسخة تجريبية: الأسماء والأسعار مثال، والطلب بيتسجل في الصفحة دي بس ومش بيتبعت لأي محل.</p>
<main>
  <h3>المنيو</h3>
  <div class="menu" id="menu"></div>
</main>
<aside class="panel" id="cart" aria-label="طلبي">
  <div class="row"><h3>طلبي</h3><button class="light" id="close-cart">إغلاق</button></div>
  <div id="lines"></div>
  <p><b>الإجمالي: <span id="total">0</span> ج.م</b></p>
  <form id="order">
    <label>الاسم<input name="name" required></label>
    <label>الموبايل<input name="phone" required pattern="01[0-9]{9}" inputmode="numeric" title="رقم مصري من 11 رقم"></label>
    <button>تسجيل الطلب</button>
  </form>
  <div id="msg" aria-live="polite"></div>
</aside>
<script type="module" src="app.js"></script>
</body>
</html>
