<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f2ea">
<title>لوحة الإدارة</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23b4532a' d='M14.5 3a2.5 2.5 0 0 1-5 0H6L2.5 7.5 5 10l1-1v12h12V9l1 1 2.5-2.5L18 3z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css"></head>
<body>
<svg class="sprite" aria-hidden="true">
  <symbol id="i-cart" viewBox="0 0 24 24"><circle class="f" cx="9.5" cy="20" r="1.5"/><circle class="f" cx="17" cy="20" r="1.5"/><path d="M3 3.5h2.2l2.3 11.7a2 2 0 0 0 2 1.6h7.3a2 2 0 0 0 2-1.6L20.5 7H6"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l.9 12.5a2 2 0 0 0 2 1.8h5.2a2 2 0 0 0 2-1.8L17.5 7"/><path d="M10.2 11v6M13.8 11v6"/></symbol>
  <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M20.5 5.5A9 9 0 1 0 21 12"/><path d="M21 3.5v5h-5"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v.01M12 11.5V16"/></symbol>
</svg>
<header><h1 class="brand">لوحة الإدارة</h1>
  <div class="actions"><button class="ghost" id="reset"><svg class="ic"><use href="#i-rotate"/></svg>إعادة البيانات التجريبية</button><a class="btn" href="index.html"><svg class="ic"><use href="#i-cart"/></svg>المتجر</a></div></header>
<main>
  <div class="notice"><svg class="ic"><use href="#i-info"/></svg>نسخة تجريبية: البيانات محفوظة في متصفحك فقط وبدون تسجيل دخول. في مشروع حقيقي لازم سيرفر وقاعدة بيانات وتسجيل دخول للإدارة.</div>
  <h2>إضافة منتج</h2>
  <form id="add" class="admin-form">
    <label>الاسم<input name="name" required></label>
    <label>النوع<select name="type"></select></label>
    <label>السعر (ج.م)<input name="price" type="number" min="1" required></label>
    <label>المقاسات (بفاصلة)<input name="sizes" placeholder="S,M,L" required></label>
    <label>الألوان (بفاصلة)<input name="colors" placeholder="أسود,أبيض" required></label>
    <label>الكمية<input name="stock" type="number" min="0" required></label>
    <button>إضافة</button>
  </form>
  <h2>المنتجات</h2>
  <div class="table-wrap"><table id="products"></table></div>
  <h2>الطلبات</h2>
  <div class="table-wrap"><table id="orders"></table></div>
</main>
<script src="products.js"></script>
<script>
const $ = (id) => document.getElementById(id);
$("add").elements.type.innerHTML = Object.entries(TYPE_LABELS).map(([k, v]) => `<option value="${k}">${v}</option>`).join("");
const STATUSES = ["جديد", "تم الشحن", "تم التسليم", "ملغي"];

function draw() {
  const ps = loadProducts();
  $("products").innerHTML = "<tr><th>المنتج</th><th>السعر</th><th>الكمية</th><th></th></tr>" +
    ps.map((p) => `<tr><td>${esc(p.name)}<div class="muted">${esc(p.sizes.join(", "))} | ${esc(p.colors.join(", "))}</div></td>
      <td><input type="number" min="1" value="${p.price}" data-edit="${p.id}|price" aria-label="السعر"></td>
      <td><input type="number" min="0" value="${p.stock}" data-edit="${p.id}|stock" aria-label="الكمية"></td>
      <td><button class="ghost small" data-del="${p.id}"><svg class="ic" style="width:15px;height:15px"><use href="#i-trash"/></svg>حذف</button></td></tr>`).join("");
  const os = loadOrders();
  $("orders").innerHTML = "<tr><th>رقم</th><th>العميل</th><th>التفاصيل</th><th>الإجمالي</th><th>الحالة</th></tr>" +
    (os.length ? os.map((o, i) => `<tr><td>${o.number}<div class="muted">${esc(o.date)}</div></td>
      <td>${esc(o.name)}<div class="muted">${esc(o.phone)}<br>${esc(o.address)}</div></td>
      <td>${o.items.map((l) => `${esc(l.name)} (${esc(l.size)}، ${esc(l.color)}) × ${l.qty}`).join("<br>")}</td>
      <td>${o.total} ج.م</td>
      <td><select data-status="${i}">${STATUSES.map((s) => `<option ${s === o.status ? "selected" : ""}>${s}</option>`).join("")}</select></td></tr>`).join("")
      : '<tr><td colspan="5" class="muted">مفيش طلبات لسه</td></tr>');
}

document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.edit) {
    const [id, key] = t.dataset.edit.split("|");
    const v = Number(t.value);
    if (!(v >= 0)) { draw(); return; }
    const ps = loadProducts(); ps.find((p) => p.id === Number(id))[key] = v; saveProducts(ps);
  } else if (t.dataset.status) {
    const os = loadOrders(); os[Number(t.dataset.status)].status = t.value; saveOrders(os);
  }
});
document.addEventListener("click", (e) => {
  const t = e.target.closest("button");
  if (t && t.dataset.del) { saveProducts(loadProducts().filter((p) => p.id !== Number(t.dataset.del))); draw(); }
});
$("reset").onclick = () => { if (confirm("مسح الطلبات ورجوع المنتجات للبيانات التجريبية؟")) { resetDemo(); draw(); } };
$("add").onsubmit = (e) => {
  e.preventDefault();
  const f = new FormData(e.target), ps = loadProducts();
  const split = (s) => s.split(",").map((x) => x.trim()).filter(Boolean);
  ps.push({ id: Date.now(), name: f.get("name").trim(), type: f.get("type"), price: Number(f.get("price")),
    sizes: split(f.get("sizes")), colors: split(f.get("colors")), stock: Number(f.get("stock")) });
  saveProducts(ps); e.target.reset(); draw();
};
draw();
</script>
</body></html>
