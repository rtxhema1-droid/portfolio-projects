<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>متجر ملابس - نسخة تجريبية</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1 class="brand">ستايل<span>.</span>هاوس</h1>
  <div class="actions">
    <a class="btn ghost" href="admin.html">الإدارة</a>
    <button id="open-cart">السلة (<span id="count">0</span>)</button>
  </div>
</header>
<section class="hero"><h2>ملابس يومية بسيطة</h2><p>اختار المقاس واللون، واطلب والدفع عند الاستلام</p></section>
<main>
  <div class="notice">نسخة تجريبية: المنتجات والأسعار وهمية، والطلبات بتتحفظ في متصفحك بس ومبتتبعتش لأي حد.</div>
  <div id="filters" class="filters" role="group" aria-label="التصنيفات"></div>
  <div id="grid" class="grid"></div>
</main>
<aside id="cart" class="panel" aria-label="السلة">
  <div class="panel-head"><h2>السلة</h2><button class="ghost" id="close-cart">إغلاق</button></div>
  <div id="cart-lines"></div>
  <div class="total">الإجمالي: <span id="total">0</span> ج.م</div>
  <form id="order-form">
    <label>الاسم<input name="name" required autocomplete="name"></label>
    <label>رقم الموبايل<input name="phone" required inputmode="numeric" pattern="01[0-9]{9}" title="رقم مصري من 11 رقم يبدأ بـ 01" autocomplete="tel"></label>
    <label>العنوان<textarea name="address" rows="2" required></textarea></label>
    <p class="muted">الدفع عند الاستلام.</p>
    <button type="submit">تسجيل الطلب</button>
  </form>
  <div id="msg" aria-live="polite"></div>
</aside>
<script src="products.js"></script>
<script src="app.js"></script>
</body>
</html>
