<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>متجر ملابس - عرض تجريبي</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>متجر الملابس</h1>
  <div><a class="btn ghost" style="background:#fff;color:#1d1d1f;border:1px solid #cfcdc6" href="admin.html">الإدارة</a>
  <button id="open-cart">السلة (<span id="count">0</span>)</button></div>
</header>
<main>
  <p class="note">عرض تجريبي: المنتجات والأسعار وهمية. الدفع عند الاستلام.</p>
  <div id="grid" class="grid"></div>
</main>
<aside id="cart" class="panel">
  <button class="ghost" id="close-cart">إغلاق</button>
  <h2>السلة</h2>
  <div id="cart-lines"></div>
  <p><b>الإجمالي: <span id="total">0</span> ج.م</b></p>
  <form id="order-form">
    <label>الاسم<input name="name" required></label>
    <label>رقم الموبايل<input name="phone" required pattern="01[0-9]{9}" title="رقم مصري من 11 رقم"></label>
    <label>العنوان<textarea name="address" rows="2" required></textarea></label>
    <button type="submit">تأكيد الطلب (الدفع عند الاستلام)</button>
  </form>
  <div id="msg"></div>
</aside>
<script src="products.js"></script>
<script src="app.js"></script>
</body>
</html>
