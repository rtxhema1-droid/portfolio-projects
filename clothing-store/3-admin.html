<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة الإدارة</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><h1>لوحة الإدارة</h1><a class="btn" href="index.html">المتجر</a></header>
<main>
  <p class="note">نسخة تجريبية: البيانات محفوظة في متصفحك فقط، ومفيش تسجيل دخول. النسخة الحقيقية تحتاج سيرفر وقاعدة بيانات.</p>
  <h2>إضافة منتج</h2>
  <form id="add">
    <input name="name" placeholder="اسم المنتج" required>
    <input name="price" type="number" min="1" placeholder="السعر" required>
    <input name="sizes" placeholder="المقاسات مفصولة بفاصلة: S,M,L" required>
    <input name="colors" placeholder="الألوان مفصولة بفاصلة" required>
    <input name="stock" type="number" min="0" placeholder="الكمية" required>
    <button>إضافة</button>
  </form>
  <h2>المنتجات</h2>
  <table id="products"></table>
  <h2>الطلبات</h2>
  <table id="orders"></table>
</main>
<script src="products.js"></script>
<script>
const COLORS = ["#c9b6a0","#7aa6a1","#b07a7a","#8f9bb3","#a8a37a"];
function draw() {
  const ps = loadProducts();
  document.getElementById("products").innerHTML =
    "<tr><th>المنتج</th><th>السعر</th><th>الكمية</th><th></th></tr>" +
    ps.map((p) => `<tr><td>${p.name}</td>
      <td><input type="number" value="${p.price}" onchange="edit(${p.id},'price',this.value)"></td>
      <td><input type="number" value="${p.stock}" onchange="edit(${p.id},'stock',this.value)"></td>
      <td><button class="ghost" onclick="del(${p.id})">حذف</button></td></tr>`).join("");
  const os = loadOrders();
  document.getElementById("orders").innerHTML =
    "<tr><th>رقم</th><th>العميل</th><th>الموبايل</th><th>العنوان</th><th>الإجمالي</th><th>الحالة</th></tr>" +
    (os.length ? os.map((o) => `<tr><td>${o.number}</td><td>${o.name}</td><td>${o.phone}</td><td>${o.address}</td><td>${o.total}</td><td>${o.status}</td></tr>`).join("")
      : '<tr><td colspan="6" class="note">مفيش طلبات لسه</td></tr>');
}
function edit(id, k, v) { const ps = loadProducts(); ps.find((p) => p.id === id)[k] = Number(v); saveProducts(ps); }
function del(id) { saveProducts(loadProducts().filter((p) => p.id !== id)); draw(); }
document.getElementById("add").onsubmit = (e) => {
  e.preventDefault();
  const f = new FormData(e.target), ps = loadProducts();
  const split = (s) => s.split(",").map((x) => x.trim()).filter(Boolean);
  ps.push({ id: Date.now(), name: f.get("name"), price: Number(f.get("price")), sizes: split(f.get("sizes")),
    colors: split(f.get("colors")), color: COLORS[ps.length % COLORS.length], stock: Number(f.get("stock")) });
  saveProducts(ps); e.target.reset(); draw();
};
draw();
</script>
</body></html>
